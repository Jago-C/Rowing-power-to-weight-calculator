<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power to Weight Ratio Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f2f0eb;
    --surface: #ffffff;
    --border: #dddad3;
    --text: #1a1a1a;
    --muted: #888880;
    --accent: #1a6b3c;
    --accent-light: #e8f5ee;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
  }

  .site-title {
    font-size: 12px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  h1 {
    font-size: clamp(40px, 8vw, 68px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  h1 span { color: var(--accent); }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.07);
  }

  .field-group { margin-bottom: 28px; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
  }

  .time-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .time-input {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 32px;
    font-weight: 700;
    text-align: center;
    padding: 14px 8px;
    width: 110px;
    transition: border-color 0.2s, background 0.2s;
    -moz-appearance: textfield;
  }

  .time-input::-webkit-outer-spin-button,
  .time-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .time-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .sep {
    font-family: 'Space Mono', monospace;
    font-size: 32px;
    font-weight: 700;
    color: var(--border);
  }

  .weight-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .weight-input {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 32px;
    font-weight: 700;
    padding: 14px 20px;
    width: 160px;
    transition: border-color 0.2s, background 0.2s;
    -moz-appearance: textfield;
  }

  .weight-input::-webkit-outer-spin-button,
  .weight-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .weight-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .unit-toggle {
    display: flex;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .unit-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    padding: 12px 18px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .unit-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .divider {
    height: 1.5px;
    background: var(--border);
    margin: 32px 0;
  }

  .result-section {
    display: none;
    animation: fadeUp 0.3s ease;
  }

  .result-section.visible { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .result-number {
    font-family: 'Space Mono', monospace;
    font-size: clamp(56px, 14vw, 88px);
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .result-unit {
    font-family: 'Space Mono', monospace;
    font-size: 20px;
    color: var(--muted);
    margin-left: 4px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 24px;
  }

  .stat-card {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
  }

  .stat-value span {
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
  }

  .benchmark-section { margin-top: 28px; }

  .benchmark-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .bench-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .bench-name {
    width: 110px;
    color: #555;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    flex-shrink: 0;
  }

  .bench-bar-wrap {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: visible;
    position: relative;
  }

  .bench-bar {
    height: 6px;
    background: #b8d8c4;
    border-radius: 3px;
  }

  .user-marker {
    position: absolute;
    top: -5px;
    width: 3px;
    height: 16px;
    background: var(--accent);
    border-radius: 2px;
    transition: left 0.5s ease;
    display: none;
  }

  .bench-val {
    color: #555;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    width: 40px;
    text-align: right;
    flex-shrink: 0;
  }

  .tier-badge {
    display: inline-block;
    margin-top: 16px;
    padding: 7px 16px;
    border-radius: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    font-weight: 700;
  }

  .empty-state {
    text-align: center;
    padding: 16px 0 4px;
  }

  .empty-state p {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }

  .prompt-arrow {
    font-size: 28px;
    color: var(--border);
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<header>
  <p class="site-title">Rowing</p>
  <h1>Power to<br><span>Weight</span></h1>
</header>

<div class="card">
  <div class="field-group">
    <label>2k PB &mdash; mm : ss</label>
    <div class="time-row">
      <input class="time-input" type="number" id="mins" placeholder="06" min="0" max="59">
      <span class="sep">:</span>
      <input class="time-input" type="number" id="secs" placeholder="30" min="0" max="59">
    </div>
  </div>

  <div class="field-group">
    <label>Bodyweight</label>
    <div class="weight-row">
      <input class="weight-input" type="number" id="weight" placeholder="75" min="1" step="0.1">
      <div class="unit-toggle">
        <button class="unit-btn active" data-unit="kg" onclick="setUnit('kg')">kg</button>
        <button class="unit-btn" data-unit="lbs" onclick="setUnit('lbs')">lbs</button>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="result-section" id="result">
    <p class="result-label">Power to weight ratio</p>
    <div>
      <span class="result-number" id="pw-value">—</span>
      <span class="result-unit">W/kg</span>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <p class="stat-label">Avg power</p>
        <p class="stat-value" id="watts-val">—<span> W</span></p>
      </div>
      <div class="stat-card">
        <p class="stat-label">500m split</p>
        <p class="stat-value" id="split-val">—</p>
      </div>
    </div>

    <div class="benchmark-section">
      <p class="benchmark-label">Where you sit</p>
      <div id="benchmarks"></div>
      <div id="tier-badge"></div>
    </div>
  </div>

  <div class="empty-state" id="empty">
    <p class="prompt-arrow">↑</p>
    <p>Enter your 2k time and<br>bodyweight to calculate.</p>
  </div>
</div>

<script>
  let unit = 'kg';

  function setUnit(u) {
    const prev = unit;
    unit = u;
    document.querySelectorAll('.unit-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.unit === u);
    });
    const w = parseFloat(document.getElementById('weight').value);
    if (!isNaN(w) && prev !== u) {
      document.getElementById('weight').value = u === 'lbs'
        ? (w * 2.20462).toFixed(1)
        : (w / 2.20462).toFixed(1);
    }
    calculate();
  }

  function getWeightKg() {
    const w = parseFloat(document.getElementById('weight').value);
    if (isNaN(w) || w <= 0) return null;
    return unit === 'lbs' ? w / 2.20462 : w;
  }

  function calcPower(totalSecs) {
    const splitSecs = totalSecs / 4;
    return 2.80 * Math.pow(500 / splitSecs, 3);
  }

  function fmtSplit(totalSecs) {
    const split = totalSecs / 4;
    const m = Math.floor(split / 60);
    const s = Math.round(split % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  const benchmarks = [
    { name: 'Club novice', value: 1.8 },
    { name: 'Competitive', value: 2.6 },
    { name: 'National', value: 3.4 },
    { name: 'Elite', value: 4.2 },
  ];

  const maxBench = 4.8;

  function getTier(pw) {
    if (pw < 2.0) return { label: 'Novice', bg: '#f0f0f0', color: '#555' };
    if (pw < 2.6) return { label: 'Club level', bg: '#e8f5ee', color: '#1a6b3c' };
    if (pw < 3.2) return { label: 'Competitive', bg: '#e8f0fb', color: '#2a4fa0' };
    if (pw < 4.0) return { label: 'National level', bg: '#fff8e0', color: '#8a6200' };
    return { label: 'Elite', bg: '#fce8f8', color: '#7a1a70' };
  }

  function renderBenchmarks(pw) {
    const container = document.getElementById('benchmarks');
    container.innerHTML = '';
    benchmarks.forEach(b => {
      const row = document.createElement('div');
      row.className = 'bench-row';

      const name = document.createElement('span');
      name.className = 'bench-name';
      name.textContent = b.name;

      const wrap = document.createElement('div');
      wrap.className = 'bench-bar-wrap';

      const bar = document.createElement('div');
      bar.className = 'bench-bar';
      bar.style.width = Math.min(100, (b.value / maxBench) * 100) + '%';

      const marker = document.createElement('div');
      marker.className = 'user-marker';
      marker.style.left = Math.min(100, (pw / maxBench) * 100) + '%';
      marker.style.display = 'block';

      wrap.appendChild(bar);
      wrap.appendChild(marker);

      const val = document.createElement('span');
      val.className = 'bench-val';
      val.textContent = b.value.toFixed(1);

      row.appendChild(name);
      row.appendChild(wrap);
      row.appendChild(val);
      container.appendChild(row);
    });

    const tier = getTier(pw);
    document.getElementById('tier-badge').innerHTML =
      `<span class="tier-badge" style="background:${tier.bg};color:${tier.color}">${tier.label}</span>`;
  }

  function calculate() {
    const m = parseInt(document.getElementById('mins').value) || 0;
    const s = parseInt(document.getElementById('secs').value) || 0;
    const totalSecs = m * 60 + s;
    const wKg = getWeightKg();

    if (!totalSecs || !wKg) {
      document.getElementById('result').classList.remove('visible');
      document.getElementById('empty').style.display = 'block';
      return;
    }

    document.getElementById('empty').style.display = 'none';
    document.getElementById('result').classList.add('visible');

    const watts = calcPower(totalSecs);
    const pw = watts / wKg;

    document.getElementById('pw-value').textContent = pw.toFixed(2);
    document.getElementById('watts-val').innerHTML = Math.round(watts) + '<span> W</span>';
    document.getElementById('split-val').innerHTML = fmtSplit(totalSecs) + '<span> /500m</span>';

    renderBenchmarks(pw);
  }

  document.getElementById('mins').addEventListener('input', calculate);
  document.getElementById('secs').addEventListener('input', calculate);
  document.getElementById('weight').addEventListener('input', calculate);

  document.getElementById('secs').addEventListener('blur', function() {
    const v = parseInt(this.value);
    if (!isNaN(v) && v > 59) this.value = 59;
  });
</script>
</body>
</html>
